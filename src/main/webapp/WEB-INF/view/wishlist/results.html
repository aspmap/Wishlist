<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div class="search_result" sec:authorize="isAuthenticated()">
  <table th:each="findUsers_view: ${findUsers}">
    <tr>
      <td class="search_result-name">
        <div class="profile-card user-icon-permission">
          <div class="profile-pic-permission">
            <img th:if="${findUsers_view.photo == null}" th:src="@{'/resources/img/icons/avatar.jpg'}">
            <img th:if="${findUsers_view.photo != null and findUsers_view.isGoogle == false}" th:src="@{'/resources/img/users/' + ${findUsers_view.username} + '/profile/' + ${findUsers_view.photo}}">
            <img th:if="${findUsers_view.photo != null and findUsers_view.isGoogle == true}" th:src="${findUsers_view.photo}">
          </div>
          <div>
              <a th:href="'#'" th:if="${findUsers_view.isGoogle == false}" th:text="${findUsers_view.username}" class="username"></a>
              <a th:href="'#'" th:if="${findUsers_view.isGoogle == true}" th:text="${findUsers_view.email}" class="username"></a>
          </div>
        </div>
      </td>
    </tr>
  </table>
</div>
